name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The form is dead if the endpoint is not inlined into the bundle at
      # build time (feature 13). A green build alone never caught that.
      - name: Assert the requirements endpoint is baked into the bundle
        run: grep -q 'data-endpoint="https://[^"]\+"' dist/index.html
